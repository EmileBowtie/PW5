<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMP — Ultimate Math Practice</title>
<style>
:root{--bg:#100e13;--card:#1b1720;--panel:#211a29;--line:#33283b;--text:#f5eff8;--muted:#b3a3bc;--quiet:#887891;--pink:#f05cff;--track:#302438}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 16% 8%,#b82bdb0d,transparent 34%),radial-gradient(ellipse at 88% 52%,#8d35c20b,transparent 36%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.015em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.24;background-image:linear-gradient(#a94fbd22 1px,transparent 1px),linear-gradient(90deg,#a94fbd22 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse at center,#000 10%,transparent 82%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E")}
.topbar{height:124px;border-bottom:1px solid #33283b;display:flex;align-items:center;position:relative;z-index:1;background:#17131a}.topbar-inner,main{width:min(100% - 64px,1280px);margin:auto}.brand{font-size:clamp(27px,2.7vw,33px);font-weight:720;letter-spacing:-.05em}.brand b{color:var(--pink)}
main{position:relative;z-index:1;padding:42px 0 72px}.intro{margin-bottom:35px}h1{font-size:clamp(27px,3vw,31px);font-weight:450;letter-spacing:-.04em;margin:0 0 9px}.intro p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.level{margin-top:34px}.level-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:15px}.level-title{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.num{color:var(--pink);font-size:12px;font-weight:650}.level-name{font-size:20px;font-weight:450;letter-spacing:-.035em}.tag{padding:4px 9px;border-radius:4px;color:#b7a9bd;background:#3a2e3f;font-size:10px}
.arrows{display:flex;gap:8px}.arrow,.close{width:30px;height:30px;display:grid;place-items:center;color:#b6aabd;background:transparent;border:1px solid var(--line);border-radius:8px;cursor:pointer}.arrow:hover,.close:hover{color:var(--pink);border-color:#76577c;background:#2b242f}
.rail{display:flex;gap:15px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:#8d7b91 var(--track);padding:0 0 13px}.rail::-webkit-scrollbar{height:4px}.rail::-webkit-scrollbar-track{background:var(--track);border-radius:99px}.rail::-webkit-scrollbar-thumb{background:#8d7b91;border-radius:99px}
.task-card{flex:0 0 344px;min-height:172px;padding:11px;border:1px solid var(--line);border-radius:13px;background:rgba(38,34,42,.92);color:inherit;text-align:left;cursor:pointer;scroll-snap-align:start;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}.task-card:hover{transform:translateY(-3px);border-color:#65496b;background:#29232e;box-shadow:0 10px 28px #0002}
.preview{height:84px;border-radius:9px;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:13px}.square{width:35px;height:35px;border-radius:8px;background:#403348}.lines{display:grid;gap:7px}.lines i{display:block;width:80px;height:6px;border-radius:20px;background:#403747}.lines i+ i{width:54px;opacity:.72}.card-title{display:block;font-size:16px;font-weight:520}.sub{display:block;margin-top:4px;color:var(--quiet);font-size:12px}
.backdrop{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:22px;background:#09080bc4;backdrop-filter:blur(8px)}.backdrop.open{display:flex;animation:fade .18s ease}.modal{width:min(100%,590px);max-height:86vh;overflow:auto;padding:25px;border:1px solid #514356;border-radius:17px;background:#242028;box-shadow:0 24px 90px #0008;animation:rise .22s ease}
.modal-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{margin:0 0 7px;color:var(--pink);font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}.modal h2{margin:0;font-size:24px;font-weight:540;letter-spacing:-.04em}.close{font-size:19px;flex:0 0 auto}
.placeholder{min-height:190px;display:grid;place-items:center;padding:25px;border:1px dashed #5a4b60;border-radius:12px;background:#2a2530;text-align:center}.symbol{width:48px;height:48px;display:grid;place-items:center;margin:0 auto 13px;border-radius:13px;color:var(--pink);background:#44334a;font-size:23px}.placeholder strong{font-size:15px;font-weight:550}.placeholder p{max-width:360px;margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
.actions{display:flex;justify-content:center;gap:10px;margin-top:22px}.btn{min-height:41px;padding:0 16px;border-radius:8px;border:1px solid var(--line);color:var(--text);background:#302a35;font:inherit;font-size:13px;cursor:pointer}.btn:hover{border-color:#715779}.primary{color:#211925;border-color:transparent;background:var(--pink);font-weight:650}.primary:hover{background:#eda0f5}
.practice{display:grid;gap:12px}.practice-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.progress{height:5px;border-radius:99px;background:#423747;overflow:hidden}.progress span{display:block;width:28%;height:100%;background:var(--pink)}.question{min-height:112px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#2a2530;color:#c4b9c8;font-size:14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{height:42px;border:1px solid var(--line);border-radius:8px;background:#29242e}
button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:700px){
.topbar{height:88px}.topbar-inner,main{width:calc(100% - 32px)}main{padding:27px 0 48px}
.brand{font-size:clamp(22px,5.5vw,28px);line-height:1.2}
h1{font-size:clamp(25px,7vw,29px);line-height:1.18}
.intro p{font-size:13px;max-width:52ch}
.level{margin-top:27px}.level-head{margin-bottom:12px}.level-name{font-size:18px}
.task-card{flex:0 0 min(84vw,360px);min-height:166px}
.rail{gap:12px;padding-bottom:12px;scroll-padding-inline:2px;touch-action:pan-x}
.arrow{width:36px;height:36px;font-size:19px}
.backdrop{padding:14px;align-items:center}
.modal{width:100%;max-height:88dvh;padding:18px;border-radius:14px}
.modal h2{font-size:21px}.placeholder{min-height:165px}
.btn{min-height:46px;min-width:112px}
}
@media(max-width:390px){
.topbar-inner,main{width:calc(100% - 26px)}
.task-card{flex-basis:86vw;padding:9px}
.preview{height:78px}
.level-title{gap:8px}.tag{font-size:9px;padding:4px 7px}
.arrows{gap:5px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><b>UMP:</b> Ultimate Math Practice</div></div></header>
<main><section class="intro"><h1>What will you practice today?</h1><p>Build your memory for formulas and methods, one topic at a time. Start with the basics and work your way up.</p></section><div id="levels"></div></main>
<div class="backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><div><p class="eyebrow" id="eyebrow">Practice preview</p><h2 id="modalTitle">Placeholder task</h2></div><button class="close" id="close" aria-label="Close">×</button></div><div id="content"></div><div class="actions"><button class="btn primary" id="start">Start</button></div></section></div>
<script>
const levels=[{n:"01",name:"Foundations",tag:"Beginner"},{n:"02",name:"Building blocks",tag:"Intermediate"},{n:"03",name:"Going further",tag:"Advanced"}];
const root=document.querySelector("#levels"),backdrop=document.querySelector("#backdrop"),content=document.querySelector("#content");
let opener=null;
const card=()=>`<button class="task-card" type="button" aria-label="Open Placeholder task"><span class="preview"><span class="square"></span><span class="lines"><i></i><i></i></span></span><span class="card-title">Placeholder task</span><span class="sub">Practice preview</span></button>`;
root.innerHTML=levels.map(l=>`<section class="level"><div class="level-head"><div class="level-title"><span class="num">${l.n}</span><span class="level-name">${l.name}</span><span class="tag">${l.tag}</span></div><div class="arrows"><button class="arrow" data-dir="-1" aria-label="Scroll left">‹</button><button class="arrow" data-dir="1" aria-label="Scroll right">›</button></div></div><div class="rail">${Array.from({length:6},card).join("")}</div></section>`).join("");
function preview(){document.querySelector("#eyebrow").textContent="Practice preview";content.innerHTML=`<div class="placeholder"><div><div class="symbol">∑</div><strong>Topic overview placeholder</strong><p>This area will contain a short explanation, key formulas and methods for the selected topic.</p></div></div>`;document.querySelector("#start").textContent="Start";document.querySelector("#start").onclick=practice;}
function practice(){document.querySelector("#eyebrow").textContent="Practice mode";content.innerHTML=`<div class="practice"><div class="practice-meta"><span>Question 1 of —</span><span>Progress preview</span></div><div class="progress"><span></span></div><div class="question">Practice task placeholder</div><div class="answers"><div class="answer"></div><div class="answer"></div><div class="answer"></div><div class="answer"></div></div></div>`;document.querySelector("#start").textContent="Back to overview";document.querySelector("#start").onclick=preview;}
function close(){backdrop.classList.remove("open");document.body.style.overflow="";opener?.focus();}
root.addEventListener("click",e=>{const arrow=e.target.closest("[data-dir]");if(arrow){arrow.closest(".level").querySelector(".rail").scrollBy({left:Number(arrow.dataset.dir)*360,behavior:"smooth"});return;}const c=e.target.closest(".task-card");if(c){opener=c;preview();backdrop.classList.add("open");document.body.style.overflow="hidden";document.querySelector("#close").focus();}});
document.querySelector("#close").onclick=close;backdrop.addEventListener("click",e=>{if(e.target===backdrop)close();});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&backdrop.classList.contains("open"))close();});
</script></body></html>
